#--------------------------------------------------------------------------------#
# Batch

# prd
# application.properties (only once initially)
#spring.batch.jdbc.initialize-schema=always
# Create batch meta tables only once, then set to never
#spring.batch.jdbc.initialize-schema=never
# Run via scheduler only (prevent auto job run on startup)
#spring.batch.job.enabled=false
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration

# dev
# Disable automatic Batch run/meta initialization (we handle it manually)
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.platform=mysql

# Image batch options
image.cleanup.in-clause-chunk=500
image.cleanup.safety-age-minutes=0

# Enable orchestration
batch.startup.orchestrate=true

# --- Image cleanup job name (must match your existing Job bean name) ---
batch.image.job-name=imageBatchJob

# --- Schedule (meta reset after image batch) ---
# 05:10 KST (meta reset)
batch.meta.reset.cron=0 10 5 * * *
# 04:30 KST (image batch)
batch.image.run.cron=0 30 4 * * *

# --- Reset safety: whether to skip reset if a job is running / Meta reset safety: skip while running (default); set true to force ---
# If true, force drop/recreate even while running
batch.meta.reset.force=false

# --- Reset chunk/logging is unnecessary (we drop/create all at once) ---

